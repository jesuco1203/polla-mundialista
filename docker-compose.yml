services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/prod.db"
      ADMIN_PIN: "${ADMIN_PIN:-1234}"
      API_FOOTBALL_KEY: "${API_FOOTBALL_KEY:-}"
    volumes:
      - polla_data:/data
    command: sh -c "npx prisma db push && npm run start"

volumes:
  polla_data:
