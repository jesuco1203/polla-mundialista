services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/prod.db"
      ADMIN_PIN: "${ADMIN_PIN:?Configura ADMIN_PIN antes de desplegar}"
      API_FOOTBALL_KEY: "${API_FOOTBALL_KEY:-}"
    volumes:
      - polla_data:/data
    command: sh -c "sqlite3 /data/prod.db < prisma/init.sql && npm run start"

volumes:
  polla_data:
